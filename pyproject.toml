[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectralint"
version = "0.1.0"
description = "Spectral analyzer for codebases — treats source files as signals to surface complexity harmonics, structural anomalies, and rhythm patterns."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "hellohaven.ai", email = "hello@hellohaven.ai" },
]
keywords = ["complexity", "static-analysis", "spectral", "fft", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0",
    "numpy>=1.24",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
spectralint = "spectralint.cli:main"
